<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: rgb(250, 251, 253); }
        header { background-color: mediumslateblue; text-align: center; padding: 20px; color: white; }
        nav { background-color: aquamarine; text-align: center; padding: 15px; }
        nav a { text-decoration: none; color: darkslategrey; font-weight: bold; margin: 0 15px; }
        nav a:hover { color: darkblue; }
        main { display: flex; justify-content: center; padding: 40px 20px; }
        form { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        form h2 { margin-bottom: 20px; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"], select, textarea {
            width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;
        }
        button { margin-top: 20px; width: 100%; padding: 12px; background-color: mediumslateblue; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: darkblue; }
        footer { background-color: khaki; text-align: center; padding: 15px; margin-top: 40px; }
    </style>
</head>
<body>
    <header>
        <h1>Registration Form</h1>
    </header>

    <nav>
        <a href="RegForm.html">Form of Registration</a>
        <a href="MyProfyle.html">Profile of Mine</a>
        <a href="Semantic.html">Mein</a>
        <a href="GradeTable.html">Table of Grade</a>
    </nav>

    <main>
        <!-- Semantic Section for the form -->
        <section>
            <form action="#" method="POST">
                <h2>Create an Account</h2>
                
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <label for="course">Select Course:</label>
                <select id="course" name="course">
                    <option value="bsit">BS Information Technology</option>
                    <option value="bscs">BS Computer Science</option>
                    <option value="bsis">BS Information Systems</option>
                </select>

                <label for="message">Why do you want to join?</label>
                <textarea id="message" name="message" rows="4" placeholder="Type your answer here..."></textarea>

                <button type="submit">Register Now</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CompSci.</p>
    </footer>
</body>
</html>
