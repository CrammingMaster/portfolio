<!DOCTYPE html>

<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #1a1a1a; color: white; }
        
        /* Top Bar */
        .top-bar { background-color: #333; padding: 10px 20px; text-align: left; }
        .top-bar a { color: white; text-decoration: none; font-weight: bold; font-size: 14px; }
        .top-bar a:hover { color: #7fff00; }

        /* Main Content Layout */
        .main-container { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        .top-section { display: flex; gap: 20px; flex-wrap: wrap; }
        .top-section section { background-color: midnightblue; padding: 20px; flex: 2; border-radius: 8px; }
        .top-section aside { background-color: chocolate; padding: 20px; flex: 1; border-radius: 8px; }
        
        .bottom-section { display: flex; gap: 20px; flex-wrap: wrap; }
        .bottom-section nav { padding: 20px; flex: 1; border-radius: 8px; text-align: center; }
        .nav-left { background-color: darkgoldenrod; }
        .nav-right { background-color: orangered; }
        
        .bottom-section a { display: block; color: chartreuse; text-decoration: none; font-size: 1.5rem; font-weight: bold; margin: 10px 0; }
        .bottom-section a:hover { text-decoration: underline; }

        /* Table Style */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: #2a2a2a; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; border: 1px solid #444; text-align: center; }
        th { background-color: #333; color: chartreuse; }
        tr:hover { background-color: #3a3a3a; }
    </style>
</head>
